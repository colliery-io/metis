name: CI (3.0)

# Metis 3.0 is built on the `3.0` release line, which integrates one branch per
# initiative (`initiative/**`); METIS-I-0031 is the first. This workflow runs
# the dual-backend checks on initiative branches and on PRs into `3.0`. It is
# separate from the 2.x `ci.yml`, which guards `main`.
#
# metis-core depends on diesel-dualdb from crates.io; the schema drift check
# uses the published `diesel-dualdb-cli`.

on:
  push:
    branches: [ "3.0", "initiative/**" ]
  pull_request:
    branches: [ "3.0" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  core-dual-backend:
    name: metis-core (Postgres + SQLite)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metis
          POSTGRES_PASSWORD: metis
          POSTGRES_DB: metis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Consumed by `#[diesel_dualdb::test]` to run the Postgres arm.
      DUALDB_PG_URL: postgres://metis:metis@localhost:5432/metis_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install diesel-dualdb-cli (schema generator)
        run: cargo install diesel-dualdb-cli --version 0.1.0 --locked

      - name: Check schema is not drifted
        run: bash crates/metis-core/scripts/check-schema-drift.sh

      - name: Build core + server
        run: cargo build -p metis-core -p metis-server

      - name: Test core + server
        # Single-threaded: the dualdb test macro shares one Postgres database
        # across tests, and each test resets the schema (db::reset), so the PG
        # arm must not run tests concurrently. SQLite uses per-test in-memory DBs.
        run: cargo test -p metis-core -p metis-server -- --test-threads=1
