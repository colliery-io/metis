[package]
name = "metis-server"
version.workspace = true
edition.workspace = true
description = "Metis 3.0 server: HTTP API, auth, and admin over the metis-core domain"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
metis-core = { path = "../metis-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }

axum = "0.7"
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"

# MCP server (same SDK as the frozen 2.x metis-docs-mcp). stdio transport only
# for now; hosted streamable-http is a follow-up task.
rust-mcp-sdk = { version = "0.8.0", default-features = false, features = [
    "server",
    "macros",
    "stdio",
] }
async-trait = "0.1"
schemars = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = { workspace = true }

[[bin]]
name = "metis"
path = "src/main.rs"

[lib]
name = "metis_server"
path = "src/lib.rs"
