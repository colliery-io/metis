[package]
name = "metis-docs-gui"
version.workspace = true
description = "Multi-project GUI for Metis Flight Levels project management"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version = "1.77.2"

# Use parent workspace

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# NOTE: Tauri crates are pinned to exact versions (`=`) to keep the Rust side in
# lockstep with the npm @tauri-apps/* packages in package.json. Cargo.lock is
# gitignored, so CI re-resolves on every build; without exact pins the Rust side
# drifts ahead of the pinned JS side and `tauri build` aborts on a version
# mismatch. Bump both sides together when upgrading Tauri.
[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.2", features = [] }
tauri-plugin-log = "=2.8.0"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-dialog = "=2.7.1"
log = "0.4"
tracing = "0.1"
metis-docs-core = { path = "../../metis-docs-core", version = "2.0.0" }
tokio = { version = "1.0", features = ["rt"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
tempfile = "3.8"
anyhow = "1.0"
